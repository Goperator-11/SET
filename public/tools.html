<body>

<nav class="nav"><div class="nav-in">
  <a class="logo" href="index.html"><span class="dot"></span>SFSE<small>SITE FOR SECURITY ENGINEERING</small></a>
  <div class="nav-menu">

</div></nav>

<main class="wrap">
  <div class="page-h">
    <div>
      <h1>도구</h1>
      <p class="sub" id="sub"></p>
    </div>
    <input class="toolsearch" id="q" type="search" placeholder="도구 이름이나 명령어로 검색" autocomplete="off">
  </div>

  <div class="filters" id="cats"></div>
  <div id="list"></div>
</main>

<footer>SFSE · Site For Security Engineering</footer>

<script src="content-tools.js?v=a02f288449"></script>
<script src="assets/data.js?v=a02f288449"></script>
<script src="assets/app.js?v=a02f288449"></script>
<script>
boot(() => {
  renderNav("tools");

  const cats = [...new Set(TOOLS.map(t => t.c))];
  let cat = "전체", term = "";

  document.getElementById("sub").textContent =
    TOOLS.length + "개 도구 · 설치부터 자주 쓰는 명령까지";

  function drawCats(){
    document.getElementById("cats").innerHTML =
      ['전체', ...cats].map(c =>
        '<button class="filt' + (cat === c ? " on" : "") + '" data-c="' + esc(c) + '" type="button">' +
        esc(c) + (c === "전체" ? " (" + TOOLS.length + ")"
                : " (" + TOOLS.filter(t => t.c === c).length + ")") + '</button>'
      ).join("");
    document.querySelectorAll("#cats .filt").forEach(b =>
      b.onclick = () => { cat = b.dataset.c; drawCats(); draw(); });
  }

  const hit = (t) => {
    if (cat !== "전체" && t.c !== cat) return false;
    if (!term) return true;
    const hay = (t.n + " " + t.d + " " + t.c + " " +
      (t.cheat || []).map(c => c[0] + " " + c[1]).join(" ") + " " +
      (t.first || []).join(" ")).toLowerCase();
    return hay.includes(term);
  };

  function draw(){
    const shown = TOOLS.filter(hit);
    if (!shown.length) {
      document.getElementById("list").innerHTML =
        '<div class="empty">찾는 도구가 없습니다.</div>';
      return;
    }
    document.getElementById("list").innerHTML = shown.map((t, i) => {
      const dayLinks = (t.days || []).map(d =>
        '<a href="problem.html?day=' + d + '">' + pad(d) + '</a>').join(" · ");
      return '<details class="tool"' + (shown.length <= 3 ? " open" : "") + '>' +
        '<summary>' +
          '<span class="tn">' + esc(t.n) + '</span>' +
          '<span class="tc">' + esc(t.c) + '</span>' +
          '<span class="td">' + esc(t.d) + '</span>' +
        '</summary>' +
        '<div class="tbody">' +
          '<div class="tmeta">' +
            '<span><b>동작 환경</b> ' + esc(t.os) + '</span>' +
            (dayLinks ? '<span><b>등장 일차</b> ' + dayLinks + '</span>' : '') +
          '</div>' +

          '<h4>설치</h4>' +
          '<pre class="tinstall">' + esc(t.i) + '</pre>' +

          '<h4>처음 5분</h4>' +
          '<ol class="tfirst">' + (t.first || []).map(s => '<li>' + s + '</li>').join("") + '</ol>' +

          '<h4>자주 쓰는 것</h4>' +
          '<div class="tablewrap"><table class="tcheat"><tbody>' +
            (t.cheat || []).map(c =>
              '<tr><td class="cc"><code>' + esc(c[0]) + '</code></td><td class="cd">' + c[1] + '</td></tr>'
            ).join("") +
          '</tbody></table></div>' +

          (t.gotcha ? '<div class="tgotcha"><b>자주 걸리는 함정</b><p>' + t.gotcha + '</p></div>' : '') +
        '</div></details>';
    }).join("");
  }

  document.getElementById("q").oninput = (e) => {
    term = e.target.value.trim().toLowerCase();
    draw();
  };

  drawCats();
  draw();
});
</script>
</body>
</html>
