<body>

<nav class="nav"><div class="nav-in">
  <a class="logo" href="index.html"><span class="dot"></span>SFSE<small>SITE FOR SECURITY ENGINEERING</small></a>
  <div class="nav-menu">
    <a href="index.html" data-page="list">문제집</a>
    <a href="wargame.html" data-page="wargame">워게임</a>

  </div>
</div></nav>

<main class="wrap">
  <div class="page-h">
    <div>
      <h1>채점 현황</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <div class="sec" style="margin-top:0">
    <h2>제출 기록 <small>최근 60건</small></h2>
    <div id="subs"></div>
  </div>

  <div class="sec">
    <h2>오답 노트 <small>틀린 적 있는 문제</small></h2>
    <div id="miss"></div>
  </div>
</main>

<footer>
  SFSE · Site For Security Engineering —
  진행 상황은 이 브라우저에만 저장됩니다. <a href="user.html">내 정보</a>에서 백업하세요.
</footer>

<script src="assets/data.js?v=f40d147d8b"></script>
<script src="assets/app.js?v=f40d147d8b"></script>
<script>
boot(() => {
renderNav("status");

const acc=accuracy();
document.getElementById("sub").textContent =
  "제출 " + S.subs.length + "회 · 정답률 " + (acc===null?"—":acc+"%") + " · 해결 " + solvedCount() + "/" + TOTAL();

const subsEl=document.getElementById("subs");
if(!S.subs.length){
  subsEl.innerHTML='<div class="empty">아직 제출한 문제가 없습니다.<br><a href="index.html">문제집</a>에서 시작하세요.</div>';
}else{
  subsEl.innerHTML='<div class="tablewrap"><table><thead><tr>'+
    '<th style="width:96px">제출 번호</th><th style="width:64px">일차</th><th>문제</th>'+
    '<th style="width:130px">결과</th><th style="width:120px">제출 시각</th>'+
    '</tr></thead><tbody>'+
    S.subs.slice(0,60).map((x,i)=>{
      const d=byDay(x.d), t=new Date(x.t);
      return '<tr><td class="num">'+(S.subs.length-i)+'</td>'+
        '<td class="no">'+pad(x.d)+'</td>'+
        '<td class="ttl"><a href="problem.html?day='+x.d+'">'+esc(d.t)+'</a>'+
          ' <span class="muted">· 문제 '+(x.q+1)+'</span></td>'+
        '<td>'+(x.r===1?'<span class="verdict v-ac">맞았습니다!!</span>'
                       :'<span class="verdict v-wa">틀렸습니다</span>')+'</td>'+
        '<td class="num">'+ymd(t).slice(5)+' '+hm(t)+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}

const missEl=document.getElementById("miss");
if(!S.miss.length){
  missEl.innerHTML='<div class="empty">아직 오답이 없습니다.</div>';
}else{
  missEl.innerHTML=S.miss.slice(0,40).map(m=>{
    const d=byDay(m.d), q=d.q[m.q];
    return '<div class="miss"><div class="h">'+
      '<a href="problem.html?day='+m.d+'">'+pad(m.d)+'번 '+esc(d.t)+'</a> · 문제 '+(m.q+1)+'</div>'+
      '<p class="q">'+q.t+'</p>'+
      '<div class="a"><b>정답</b> · '+q.o[q.a]+'</div></div>';
  }).join("");
}
});
</script>
</body>
</html>
