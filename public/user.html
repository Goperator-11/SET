<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>내 정보 — SFSE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=9cac8be23e">
</head>
<body>

<nav class="nav"><div class="nav-in">
  <a class="logo" href="index.html"><span class="dot"></span>SFSE<small>SITE FOR SECURITY ENGINEERING</small></a>
  <div class="nav-menu">
    <a href="index.html" data-page="list">문제집</a>
    <a href="wargame.html" data-page="wargame">워게임</a>
    <a href="tools.html" data-page="tools">도구</a>
    <a href="shop.html" data-page="shop">상점</a>
    <a href="team.html" data-page="team" hidden>팀</a>
    <a href="user.html" data-page="user">내 정보</a>
    <a href="rank.html" data-page="rank" hidden>랭킹</a>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <span class="nav-user" id="nav-account"></span>
    <button class="nav-btn" id="theme-btn" type="button">테마</button>
  </div>
</div></nav>

<main class="wrap">
  <div class="page-h">
    <div>
      <h1>내 정보</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <div id="summary"></div>

  <div class="sec">
    <h2>액트별 진행도</h2>
    <div class="tablewrap"><table>
      <thead><tr><th style="width:64px">ACT</th><th>주제</th><th style="width:110px">해결</th>
        <th style="width:200px">진행률</th><th style="width:96px">상태</th></tr></thead>
      <tbody id="acts"></tbody>
    </table></div>
  </div>

  <div class="sec" id="status">
    <h2>제출 기록 <small>최근 60건</small></h2>
    <div id="subs"></div>
  </div>

  <div class="sec">
    <h2>오답 노트 <small>틀린 적 있는 문제</small></h2>
    <div id="miss"></div>
  </div>

  <div class="sec">
    <h2>배지 <small id="badge-count"></small></h2>
    <div class="badges" id="badges"></div>
  </div>

  <div class="sec">
    <h2>계급표</h2>
    <div class="tablewrap"><table>
      <thead><tr><th style="width:74px">레벨</th><th>계급</th><th style="width:120px">필요 XP</th>
        <th style="width:96px">상태</th></tr></thead>
      <tbody id="ranks"></tbody>
    </table></div>
  </div>

  <div class="sec">
    <h2>데이터 백업</h2>
    <div class="card">
      <p class="hint">진행 상황은 이 브라우저에만 저장됩니다. 기기를 바꾸거나 방문 기록을 지우면 사라지므로,
        아래 내보내기로 받은 문자열을 어딘가에 보관해 두세요.</p>
      <div class="row">
        <button class="btn ghost sm" id="ex" type="button">내보내기</button>
        <button class="btn ghost sm" id="im" type="button">불러오기</button>
        <button class="btn danger sm" id="rs" type="button">처음부터 다시</button>
      </div>
      <textarea id="ta" spellcheck="false" placeholder="내보내기를 누르면 여기에 저장 데이터가 나타납니다. 불러오려면 보관해 둔 데이터를 붙여넣고 불러오기를 누르세요."></textarea>
    </div>
  </div>
</main>

<footer>
  SFSE · Site For Security Engineering —
  진행 상황은 이 브라우저에만 저장됩니다.
</footer>

<script src="assets/data.js?v=9cac8be23e"></script>
<script src="assets/app.js?v=9cac8be23e"></script>
<script>
boot(() => {
function draw(){
  renderNav("user");
  const i=rankIdx();
  document.getElementById("sub").innerHTML =
    "LV." + (i+1) + " " + esc(RANKS[i].n) + " · " + S.xp + " XP · " +
    (S.pts||0) + " P · 해결 " + solvedCount() + "/" + TOTAL() +
    " · 제출 " + S.subs.length + "회 · 정답률 " +
    (accuracy()===null ? "—" : accuracy()+"%") +
    ' · <a href="shop.html">상점</a>';
  document.getElementById("summary").innerHTML = summaryHTML();


  /* ── 채점 현황 (예전 status.html) ── */
  const subsEl = document.getElementById("subs");
  if (!S.subs.length) {
    subsEl.innerHTML = '<div class="empty">아직 제출한 문제가 없습니다.<br>' +
      '<a href="index.html">문제집</a>에서 시작하세요.</div>';
  } else {
    subsEl.innerHTML = '<div class="tablewrap"><table><thead><tr>' +
      '<th style="width:96px">제출 번호</th><th style="width:64px">일차</th><th>문제</th>' +
      '<th style="width:130px">결과</th><th style="width:120px">제출 시각</th>' +
      '</tr></thead><tbody>' +
      S.subs.slice(0, 60).map((x, i) => {
        const d = byDay(x.d), t = new Date(x.t);
        return '<tr><td class="num">' + (S.subs.length - i) + '</td>' +
          '<td class="no">' + pad(x.d) + '</td>' +
          '<td class="ttl"><a href="problem.html?day=' + x.d + '">' + esc(d.t) + '</a>' +
            ' <span class="muted">· 문제 ' + (x.q + 1) + '</span></td>' +
          '<td>' + (x.r === 1 ? '<span class="verdict v-ac">맞았습니다!!</span>'
                              : '<span class="verdict v-wa">틀렸습니다</span>') + '</td>' +
          '<td class="num">' + ymd(t).slice(5) + ' ' + hm(t) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }

  const missEl = document.getElementById("miss");
  if (!S.miss.length) {
    missEl.innerHTML = '<div class="empty">아직 오답이 없습니다.</div>';
  } else {
    missEl.innerHTML = S.miss.slice(0, 40).map(m => {
      const d = byDay(m.d), q = d.q[m.q];
      return '<div class="miss"><div class="h">' +
        '<a href="problem.html?day=' + m.d + '">' + pad(m.d) + '번 ' + esc(d.t) + '</a>' +
        ' · 문제 ' + (m.q + 1) + '</div>' +
        '<p class="q">' + q.t + '</p>' +
        '<div class="a"><b>정답</b> · ' + (q.o ? q.o[q.a] : esc(q.a[0])) + '</div></div>';
    }).join("");
  }

  document.getElementById("acts").innerHTML = ACTS.map(a=>{
    const c=a.days.filter(d=>isSolved(d.d)).length, p=Math.round(c/a.days.length*100);
    const open=a.days.some(d=>unlocked(d.d));
    return '<tr class="'+(c===a.days.length?"solved":"")+'"><td class="no">'+a.n+'</td>'+
      '<td class="ttl"><b>'+esc(a.t)+'</b><br><span class="muted" style="font-size:12.5px">'+esc(a.s)+'</span></td>'+
      '<td class="num">'+c+' / '+a.days.length+'</td>'+
      '<td><div class="pbar ac" style="margin:0"><i style="width:'+p+'%"></i></div></td>'+
      '<td>'+(c===a.days.length?'<span class="verdict v-ac">완료</span>'
        :open?'<span class="verdict v-part">진행 중</span>'
        :'<span class="v-none">잠김</span>')+'</td></tr>';
  }).join("");

  document.getElementById("badge-count").textContent = S.badges.length + " / " + BADGES.length + " 획득";
  document.getElementById("badges").innerHTML = BADGES.map(b=>{
    const got=S.badges.includes(b.id);
    return '<div class="bg-item'+(got?" got":"")+'"><div class="n">'+(got?esc(b.n):"？？？")+'</div>'+
      '<div class="d">'+esc(b.d)+'</div></div>';
  }).join("");

  document.getElementById("ranks").innerHTML = RANKS.map((r,k)=>{
    const reached = S.xp>=r.xp;
    return '<tr class="'+(reached?"solved":"")+(k===i?" now":"")+'">'+
      '<td class="no">LV.'+(k+1)+'</td>'+
      '<td class="ttl"><span class="greek">'+esc(r.n)+'</span></td>'+
      '<td class="num">'+r.xp+'</td>'+
      '<td>'+(k===i?'<span class="verdict v-ac">현재</span>'
        :reached?'<span class="muted">달성</span>'
        :'<span class="v-none">'+(r.xp-S.xp)+' 남음</span>')+'</td></tr>';
  }).join("");
}
draw();

const ta=document.getElementById("ta");
document.getElementById("ex").onclick=()=>{
  ta.value=JSON.stringify(S); ta.select();
  toast("복사해서 안전한 곳에 보관하세요");
};
document.getElementById("im").onclick=()=>{
  try{
    const o=JSON.parse(ta.value);
    if(typeof o.xp!=="number"||typeof o.done!=="object") throw 0;
    S=Object.assign({},BLANK,o);
    ["miss","badges","subs"].forEach(k=>{if(!Array.isArray(S[k])) S[k]=[]});
    if(typeof S.hist!=="object"||!S.hist) S.hist={};
    save(); draw(); toast("불러왔습니다");
  }catch(e){ toast("데이터 형식이 올바르지 않습니다"); }
};
document.getElementById("rs").onclick=()=>{
  if(!confirm("모든 진행 상황이 지워집니다. 계속할까요?")) return;
  const th=S.theme;
  S=Object.assign({},BLANK,{theme:th, done:{}, miss:[], badges:[], subs:[], hist:{}});
  save(); draw(); ta.value=""; toast("초기화했습니다");
};
});
</script>
</body>
</html>
