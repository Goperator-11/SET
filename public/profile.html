<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>프로필 — SFSE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=822522860e">
</head>
<body>

<nav class="nav"><div class="nav-in">
  <a class="logo" href="index.html"><span class="dot"></span>SFSE<small>SITE FOR SECURITY ENGINEERING</small></a>
  <div class="nav-menu">
    <a href="index.html" data-page="list">문제집</a>
    <a href="wargame.html" data-page="wargame">워게임</a>
    <a href="tools.html" data-page="tools">도구</a>
    <a href="shop.html" data-page="shop">상점</a>
    <a href="team.html" data-page="team" hidden>팀</a>
    <a href="user.html" data-page="user">내 정보</a>
    <a href="rank.html" data-page="rank" hidden>랭킹</a>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <span class="nav-user" id="nav-account"></span>
    <button class="nav-btn" id="theme-btn" type="button">테마</button>
  </div>
</div></nav>

<main class="wrap"><div id="body"></div></main>

<footer>SFSE · Site For Security Engineering</footer>

<script src="assets/data.js?v=822522860e"></script>
<script src="assets/app.js?v=822522860e"></script>
<script>
boot(async () => {
  renderNav("");
  const el = document.getElementById("body");
  const who = new URLSearchParams(location.search).get("u") || "";

  if (Store.mode !== "server") {
    el.innerHTML = '<div class="empty">프로필은 서버에 로그인했을 때만 볼 수 있습니다.<br>' +
      '지금은 브라우저에만 저장하는 로컬 모드입니다.</div>';
    return;
  }
  if (!who) { el.innerHTML = '<div class="empty">누구의 프로필인지 지정되지 않았습니다.</div>'; return; }

  let p, me;
  try {
    const r = await fetch("api/profile?u=" + encodeURIComponent(who));
    if (r.status === 404) { el.innerHTML = '<div class="empty">그런 사용자가 없습니다.</div>'; return; }
    if (!r.ok) throw new Error();
    ({ profile: p, me } = await r.json());
  } catch { el.innerHTML = '<div class="empty">프로필을 불러오지 못했습니다.</div>'; return; }

  const lv = RANKS.reduce((a, r2, k) => p.xp >= r2.xp ? k : a, 0);
  const nx = RANKS[lv + 1];
  const pct = nx ? Math.min(100, (p.xp - RANKS[lv].xp) / (nx.xp - RANKS[lv].xp) * 100) : 100;
  const acc = p.subs ? Math.round(p.first / p.subs * 100) : null;

  el.innerHTML =
    '<div class="page-h"><div>' +
      '<h1 class="pname">' + nameHTML(p.username, p.cos, p.team) +
        (p.username === me ? ' <span class="muted">(나)</span>' : '') + '</h1>' +
      '<p class="sub">' +
        (p.team ? '소속 <a href="team.html?id=' + p.team.id + '">' + esc(p.team.name) + '</a>'
                : '소속 없음') +
        ' · 가입 ' + (p.joinedAt ? ymd(new Date(p.joinedAt)) : "—") +
        ' · 마지막 활동 ' + (p.updatedAt ? ymd(new Date(p.updatedAt)) : "—") +
        (p.redSolved ? ' · <span class="ttag" style="background:#c93b3b;color:#fff;border:0">RED</span> 공격 코스 ' + p.redSolved + '일' : '') +
      '</p>' +
    '</div></div>' +

    '<div class="summary">' +
      '<div class="card rank"><div class="k">계급</div>' +
        '<div class="tierline">' + tierHTML(lv, false) +
          '<span class="v">' + esc(RANKS[lv].n) + '</span>' +
          '<span class="lvchip">LV.' + (lv + 1) + '</span></div>' +
        '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="pmeta"><span class="mono">' + p.xp + ' XP</span>' +
          '<span class="mono">' + (nx ? "다음 " + nx.n : "최고 계급") + '</span></div></div>' +
      '<div class="card"><div class="k">해결</div><div class="v">' + p.solved +
        '<small>/' + GRAND_TOTAL() + '</small></div>' +
        '<div class="pbar ac"><i style="width:' + (p.solved / GRAND_TOTAL() * 100) + '%"></i></div>' +
        '<div class="pmeta"><span>방어+공격</span><span class="mono">' +
          Math.round(p.solved / GRAND_TOTAL() * 100) + '%</span></div></div>' +
      '<div class="card"><div class="k">연속 학습</div><div class="v">' + p.streak + '<small>일</small></div>' +
        '<div class="pmeta" style="margin-top:11px"><span>최고 기록</span>' +
          '<span class="mono">' + p.best + '일</span></div></div>' +
      '<div class="card"><div class="k">정답률</div><div class="v">' +
        (acc === null ? "—" : acc + '<small>%</small>') + '</div>' +
        '<div class="pmeta" style="margin-top:11px"><span>제출</span>' +
          '<span class="mono">' + p.subs + '회</span></div></div>' +
    '</div>' +

    '<section class="sec"><h2>액트별 진행 <span class="muted">방어 코스</span></h2><div class="ladder">' +
      TRACKS.blue.acts.map(a => {   // 프로필은 활성 트랙과 무관하게 방어 커리큘럼을 보여준다
        const c = p.acts[a.n] || 0;
        return '<div class="lrow' + (c === a.days.length ? " now" : c === 0 ? " locked" : "") + '">' +
          '<b style="font-size:12.5px">ACT ' + a.n + '</b>' +
          '<span style="font-size:12.5px">' + esc(a.t) + '</span>' +
          '<span class="lxp">' + c + ' / ' + a.days.length + '</span></div>';
      }).join("") +
    '</div>' +
    (p.redSolved ? '<p class="sub" style="margin-top:12px"><span class="ttag" style="background:#c93b3b;color:#fff;border:0">RED</span> 공격 코스 ' +
       p.redSolved + ' / ' + trackDays("red") + '일 해결</p>' : '') +
    '</section>' +

    '<section class="sec"><h2>배지 <span class="muted">' + p.badges.length + ' / ' + BADGES.length + '</span></h2>' +
      '<div class="shop-grid">' +
        BADGES.filter(b => p.badges.includes(b.id)).map(b =>
          '<div class="sitem"><div class="sname" style="font-size:15px">' + esc(b.n) + '</div>' +
          '<div class="sdesc">' + esc(b.d) + '</div></div>').join("") +
      '</div>' +
      (p.badges.length ? "" : '<div class="empty">아직 배지가 없습니다.</div>') +
    '</section>';
});
</script>
</body>
</html>
