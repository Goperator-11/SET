<main class="wrap">
  <div class="page-h">
    <div>
      <h1>랭킹</h1>
      <p class="sub">이 서버에서 함께 공부하는 사람들</p>
    </div>
  </div>
  <div id="body"></div>
</main>

<footer>SFSE · Site For Security Engineering</footer>

<script src="assets/data.js?v=43059af564"></script>
<script src="assets/app.js?v=43059af564"></script>
<script>
boot(async () => {
  renderNav("rank");
  const el = document.getElementById("body");

  if (Store.mode !== "server") {
    el.innerHTML = '<div class="empty">랭킹은 서버에 로그인했을 때만 볼 수 있습니다.<br>' +
      '지금은 브라우저에만 저장하는 로컬 모드입니다.</div>';
    return;
  }

  try {
    const r = await fetch("api/ranking");
    if (!r.ok) throw new Error();
    const { me, rows } = await r.json();
    if (!rows.length) { el.innerHTML = '<div class="empty">아직 아무도 없습니다.</div>'; return; }

    el.innerHTML = '<div class="tablewrap"><table><thead><tr>' +
      '<th style="width:60px">순위</th><th style="width:130px">계급</th><th>아이디</th>' +
      '<th style="width:110px">XP</th>' +
      '<th style="width:100px">해결</th><th style="width:100px">연속</th>' +
      '<th style="width:120px">마지막 활동</th></tr></thead><tbody>' +
      rows.map((x, i) => {
        const lv = RANKS.reduce((a, r2, k) => x.xp >= r2.xp ? k : a, 0);
        return '<tr class="' + (x.username === me ? "me " : "") + (i === 0 ? "rk1" : "") + '">' +
          '<td class="rk">' + (i + 1) + '</td>' +
          '<td>' + tierHTML(lv, true) + '</td>' +
          '<td class="ttl">' + profileLink(x.username, x.cos, x.team) +
            (x.username === me ? ' <span class="muted">(나)</span>' : '') + '</td>' +
          '<td class="num">' + x.xp + '</td>' +
          '<td class="num">' + x.solved + ' / ' + GRAND_TOTAL() + '</td>' +
          '<td class="num">' + x.streak + '일</td>' +
          '<td class="num">' + (x.updatedAt ? ymd(new Date(x.updatedAt)).slice(5) : "—") + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<p class="sub" style="margin-top:12px">아이디를 누르면 프로필이 열립니다. ' +
      '계급은 XP 로 오르고, 닉네임 치장은 <a href="shop.html">상점</a>에서 포인트로 삽니다. ' +
      '앞의 태그는 <a href="team.html">팀</a>입니다.</p>';
  } catch {
    el.innerHTML = '<div class="empty">랭킹을 불러오지 못했습니다.</div>';
  }
});
</script>
</body>
</html>
